aid: sortera-alloys
name: Sortera Technologies
description: >-
  Sortera Technologies (formerly Sortera Alloys) is an AI-driven metals recycling company founded in
  2020 and headquartered in Markle / Fort Wayne, Indiana. It combines sensor fusion (XRF plus optical),
  machine-learning image and data analytics, and an advanced high-throughput scrap feeder to sort
  end-of-life scrap by metal type and alloy composition, upgrading feedstock streams and removing
  contaminants at industrial scale. From a 200,000 square foot sortation facility opened in 2023 the
  company produces specification aluminum scrap across cast, extrusion and sheet fractions - including
  380, 356, 319 and wrought grades such as 3105 - and sells it back into domestic manufacturing. Its
  stated vision is 100% reuse of metals recovered from end-of-life products. The artificial
  intelligence runs inside Sortera's own sorting lines as an in-house platform; the product sold is
  recycled metal, not software, and the company publishes no public API, SDK, developer portal or
  machine-readable specification.
